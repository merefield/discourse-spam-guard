plugins:
  spam_guard_enabled:
    default: false
  spam_guard_mode:
    default: observe
    type: enum
    choices:
      - observe
      - review
      - protect
  spam_guard_preset:
    default: conservative
    type: enum
    choices:
      - conservative
      - balanced
  spam_guard_check_email:
    default: true
  spam_guard_check_ip:
    default: true
  spam_guard_check_username:
    default: false
  spam_guard_local_signals:
    default: true
  spam_guard_reading_limited_adjustment:
    default: -5
    min: -100
    max: 0
  spam_guard_reading_meaningful_adjustment:
    default: -10
    min: -100
    max: 0
  spam_guard_reading_sustained_adjustment:
    default: -15
    min: -100
    max: 0
  spam_guard_no_reading_adjustment:
    default: 10
    min: 0
    max: 100
  spam_guard_confirmed_spam_points:
    default: 80
    min: 0
    max: 100
  spam_guard_local_points_cap:
    default: 100
    min: 0
    max: 100
  spam_guard_region:
    default: closest
    type: enum
    choices:
      - closest
      - europe
  spam_guard_recheck_hours:
    default: 24
    min: 0
    max: 168
  spam_guard_retention_days:
    default: 30
    min: 7
    max: 365
  spam_guard_email_confidence:
    default: 90
    min: 50
    max: 100
  spam_guard_email_frequency:
    default: 5
    min: 2
    max: 10000
  spam_guard_ip_confidence:
    default: 95
    min: 50
    max: 100
  spam_guard_ip_frequency:
    default: 10
    min: 2
    max: 10000
  spam_guard_max_evidence_age_days:
    default: 30
    min: 1
    max: 90
